[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-ws-research"
version = "0.1.0"
description = "X post collection and Weiss Schwarz deck recognition desktop tool (Phase 1 skeleton)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "playwright>=1.40",
    "pydantic>=2.5",
    "SQLAlchemy>=2.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
x-ws-research = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "crawler*", "services*", "vision*", "storage*", "schemas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
